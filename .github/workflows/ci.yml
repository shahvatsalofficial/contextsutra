name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
        exclude:
          - {os: macos-latest, node: '20'}
          - {os: macos-latest, node: '22'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run demo
      - run: npm run doctor
      - run: node packages/cli/index.mjs audit --out artifacts/audit
      - run: node scripts/build-docs.mjs --check
      - uses: actions/upload-artifact@v7
        if: matrix.node == '24'
        with:
          name: audit-${{ matrix.os }}
          path: artifacts
